<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JobAgent Matrix Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden">
    <header class="p-6 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight">🤖 JobAgent Matrix Workspace</h1>
        <div id="job-counter" class="text-sm text-gray-400 font-mono">Loading...</div>
    </header>

    <main class="flex flex-1 overflow-hidden p-4 gap-4">
        <div id="job-list-container" class="w-1/3 overflow-y-auto space-y-4 pr-2"></div>
        
        <div id="details-panel" class="flex-1 p-8 bg-gray-900 rounded-lg border border-gray-800 overflow-y-auto">
            <div class="text-gray-500 text-center mt-20">Select a job from the sidebar to inspect matching metrics.</div>
        </div>
    </main>

    <script>
        // Ensure this path matches the actual file location on your machine
        const JSON_PATH = 'jobs/google_matched_jobs.json';
        let jobsData = [];

        async function loadData() {
            try {
                const response = await fetch(`${JSON_PATH}?t=${new Date().getTime()}`);
                jobsData = await response.json();
                document.getElementById('job-counter').innerText = `${jobsData.length} Automation Openings Mapped`;
                renderList(jobsData);
            } catch (e) {
                document.getElementById('job-counter').innerText = "Error Loading Data";
                console.error("Fetch error:", e);
            }
        }

        function renderList(jobs) {
            const container = document.getElementById('job-list-container');
            container.innerHTML = jobs.map((job, index) => `
                <div class="bg-gray-900 p-5 rounded-xl border border-gray-800 hover:border-blue-500 transition-all cursor-pointer space-y-3" onclick="showDetails(${index})">
                    <div class="flex justify-between items-start">
                        <p class="text-blue-400 text-[10px] font-bold uppercase">${job.company}</p>
                        <span class="text-gray-500 text-[10px]">${job.dateScraped}</span>
                    </div>
                    <h4 class="font-bold text-sm text-white">${job.jobTitle}</h4>
                    
                    <div class="flex flex-wrap gap-2 pt-1">
                        ${job.skillsNeeded.map(s => `
                            <span class="bg-emerald-950 text-emerald-400 text-[10px] px-2 py-0.5 rounded border border-emerald-900">
                                ${s}
                            </span>
                        `).join('')}
                    </div>

                    <a href="${job.directApplyLink}" target="_blank" 
                       class="block w-full text-center bg-blue-600 text-white py-1.5 mt-2 rounded-lg font-bold text-xs hover:bg-blue-500 transition-colors">
                       Apply
                    </a>
                </div>
            `).join('');
        }

        function showDetails(index) {
            const job = jobsData[index];
            const panel = document.getElementById('details-panel');
            panel.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-2xl font-bold text-white">${job.jobTitle}</h2>
                            <p class="text-blue-400 font-bold uppercase text-xs">${job.company}</p>
                        </div>
                        <a href="${job.directApplyLink}" target="_blank" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-500 text-sm">Apply</a>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-gray-950 p-4 rounded-lg border border-gray-800">
                            <div class="text-gray-500 text-[10px] uppercase font-bold mb-2">Skills You Have</div>
                            <div class="flex flex-wrap gap-1">${job.skillsNeeded.map(s => `<span class="bg-emerald-950 text-emerald-400 text-[10px] px-2 py-1 rounded border border-emerald-900">${s}</span>`).join('')}</div>
                        </div>
                        <div class="bg-gray-950 p-4 rounded-lg border border-gray-800">
                            <div class="text-gray-500 text-[10px] uppercase font-bold mb-2">Profile Gaps</div>
                            <div class="flex flex-wrap gap-1">${job.missingSkills.map(s => `<span class="bg-rose-950 text-rose-400 text-[10px] px-2 py-1 rounded border border-rose-900">${s}</span>`).join('')}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        loadData();
    </script>
</body>
</html>
